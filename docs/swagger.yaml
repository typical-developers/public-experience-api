definitions:
  API.ErrorResponse:
    properties:
      message:
        description: The message for the returned error.
        type: string
      type:
        description: The type of error that was returned.
        type: string
    type: object
  Oaklands.V1.Changelog:
    properties:
      added:
        items:
          type: string
        type: array
      changed:
        items:
          type: string
        type: array
      date:
        type: string
      fixed:
        items:
          type: string
        type: array
      id:
        type: integer
      version:
        type: string
    type: object
  Oaklands.V1.ChangelogVersion:
    properties:
      date:
        type: string
      id:
        type: integer
      version:
        type: string
    type: object
  Oaklands.V1.IndexDrop:
    properties:
      chance:
        description: The chance of the material dropping.
        type: number
      display_name:
        description: The display name of the material that can drop.
        type: string
      name:
        description: The name of the material that can drop.
        type: string
    type: object
  Oaklands.V1.IndexEntry:
    properties:
      category:
        description: The category of the entry (trees, rocks, ores, creatures or forageables).
        type: string
      description:
        description: The description of the entry.
        type: string
      display_name:
        description: The display name of the entry.
        type: string
      drops:
        description: The materials that the entry can drop (enemies only).
        items:
          $ref: '#/definitions/Oaklands.V1.IndexDrop'
        type: array
      enemy:
        description: Whether the entry is an enemy.
        type: boolean
      id:
        description: The ID of the entry.
        type: string
      media:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.Media'
        description: The image of the entry.
      sections:
        description: The sections (sub-biomes) that the entry can be found in.
        items:
          $ref: '#/definitions/Oaklands.V1.IndexSection'
        type: array
      stats:
        additionalProperties: {}
        description: The stats for the entry, if it has any.
        type: object
      tier:
        description: The tool tier needed to harvest the entry, if it has one.
        type: integer
      variants:
        additionalProperties:
          $ref: '#/definitions/Oaklands.V1.IndexVariant'
        description: The variants of the entry (e.g. raw, refined, forged), if it
          has any.
        type: object
    type: object
  Oaklands.V1.IndexEntryInfo:
    properties:
      category:
        description: The category of the entry (trees, rocks, ores, creatures or forageables).
        type: string
      id:
        description: The ID of the entry.
        type: string
      media:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.Media'
        description: The image of the entry.
    type: object
  Oaklands.V1.IndexSection:
    properties:
      display_name:
        description: The display name of the section.
        type: string
      id:
        description: The ID of the section (e.g. FloweringMeadows, Special, Event
          or Unobtainable).
        type: string
    type: object
  Oaklands.V1.IndexVariant:
    properties:
      display_name:
        description: The display name of the variant.
        type: string
      value:
        description: The value of the variant, if it has one.
        type: number
    type: object
  Oaklands.V1.Item:
    properties:
      currency:
        description: The type of currency that the item sells for if it's sold in
          a store.
        type: string
      description:
        description: The description of the item.
        type: string
      display_name:
        description: The name of the item.
        type: string
      forms:
        description: The forms that the item has / converts to.
        items:
          $ref: '#/definitions/Oaklands.V1.ItemForm'
        type: array
      id:
        description: The ID of the item
        type: string
      image:
        description: |-
          An image preview of the item.

          Deprecated: Use `media` instead.
        type: string
        x-deprecated: "true"
      media:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.Media'
        description: An image preview of the item.
      price:
        description: The price for the item if it's sold in a store.
        type: number
      stats:
        additionalProperties: {}
        description: The stats for an item, if it has any.
        type: object
      unbox_time:
        description: The time (e.g. for Gifts) that the item can be opened.
        type: string
    type: object
  Oaklands.V1.ItemForm:
    properties:
      convert_id:
        description: |-
          The id of the item that the object converts to.
          ConvertID will be omitted on items that are not yet viewable,
          e.g. gifts that have not been opened yet.
        type: string
      convert_type:
        description: The type that the itme will convert to when unboxed.
        type: string
      image:
        description: |-
          The image of this form.

          Deprecated: Use `media` instead.
        type: string
        x-deprecated: "true"
      media:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.Media'
        description: The image of this form.
      type:
        description: The type of form of the item.
        type: string
      unbox_types:
        description: The different, unique unbox types.
        items:
          $ref: '#/definitions/Oaklands.V1.ItemFormUnboxType'
        type: array
    type: object
  Oaklands.V1.ItemFormUnboxType:
    properties:
      convert_type:
        description: The type that the unboxed form will convert to.
        type: string
      image:
        description: |-
          The image of the unboxed item type.

          Deprecated: Use `media` instead.
        type: string
        x-deprecated: "true"
      media:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.Media'
        description: The image of the unboxed item type.
      type:
        description: The form type that the item can unbox as.
        type: string
    type: object
  Oaklands.V1.MaterialBuff:
    properties:
      currency_type:
        description: The currency type that the resource sells for.
        type: string
      display_name:
        description: The name of the resource.
        type: string
      multiplier:
        description: The multiplier that the resource will sell for.
        type: number
      resource_id:
        description: The ID for the resource.
        type: string
      values:
        description: The value multiplier information for each resource type.
        items:
          $ref: '#/definitions/Oaklands.V1.MaterialBuffValue'
        type: array
    type: object
  Oaklands.V1.MaterialBuffValue:
    properties:
      base_value:
        description: The base value of the material if it were sold un-buffed.
        type: number
      buffed_value:
        description: The value of the material buffed.
        type: number
      type:
        description: The type of material.
        type: string
    type: object
  Oaklands.V1.Media:
    properties:
      asset_id:
        description: The Roblox asset id, if it exists.
        type: string
      url:
        description: The URL to the hosted media file, if it exists.
        type: string
    type: object
  Oaklands.V1.Minimap:
    properties:
      layers:
        description: The layers of the minimap.
        items:
          $ref: '#/definitions/Oaklands.V1.MinimapLayer'
        type: array
    type: object
  Oaklands.V1.MinimapLayer:
    properties:
      X:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.MinimapPosition'
        description: The min/max X location in the world.
      Z:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.MinimapPosition'
        description: The min/max Y location in the world.
      image_ids:
        description: |-
          The image IDs of the minimap.
          This is from left -> right.

          Deprecated: Use `media` instead.
        items:
          type: string
        type: array
        x-deprecated: "true"
      layer_id:
        description: The ID of the layer.
        type: string
      locations:
        description: The locations marked on the layer.
        items:
          $ref: '#/definitions/Oaklands.V1.MinimapLocation'
        type: array
      media:
        description: |-
          The images of the minimap.
          This is from left -> right.
        items:
          $ref: '#/definitions/Oaklands.V1.Media'
        type: array
    type: object
  Oaklands.V1.MinimapLocation:
    properties:
      color:
        description: The hex color of the location's marker.
        type: string
      conditional:
        description: Whether the location is only shown under certain conditions (e.g.
          events).
        type: boolean
      marker:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.Media'
        description: The location's marker.
      name:
        description: The name of the location.
        type: string
      position:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.MinimapLocationPosition'
        description: The position of the location in the world.
      property_id:
        description: The ID of the property, if the location is a property.
        type: integer
    type: object
  Oaklands.V1.MinimapLocationPosition:
    properties:
      x:
        description: The X position in the world.
        type: number
      "y":
        description: The Y position in the world.
        type: number
      z:
        description: The Z position in the world.
        type: number
    type: object
  Oaklands.V1.MinimapPosition:
    properties:
      max:
        description: The maximum position.
        type: integer
      min:
        description: The minimum position.
        type: integer
    type: object
  Oaklands.V1.Newsletter:
    properties:
      banner:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.Media'
        description: The banner of the newsletter.
      banner_image_id:
        description: |-
          The Roblox ID for the banner of the newsletter.

          Deprecated: Use `banner` instead.
        type: string
        x-deprecated: "true"
      date:
        description: The date that the newsletter was released.
        type: string
      header:
        description: The primary header of the newsletter.
        type: string
      sections:
        description: Sections of the newsletter.
        items:
          $ref: '#/definitions/Oaklands.V1.NewsletterSection'
        type: array
      subheader:
        description: The secondary header of the newsletter.
        type: string
    type: object
  Oaklands.V1.NewsletterEntry:
    properties:
      banner:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.Media'
        description: The banner of the newsletter.
      banner_image_id:
        description: |-
          The Roblox ID for the banner of the newsletter.

          Deprecated: Use `banner` instead.
        type: string
        x-deprecated: "true"
      date:
        description: The date that the newsletter was released.
        type: string
      header:
        description: The primary header of the newsletter.
        type: string
      id:
        description: The ID for the newsletter.
        type: string
    type: object
  Oaklands.V1.NewsletterSection:
    properties:
      content:
        description: The type of content in the section.
        items: {}
        type: array
      header:
        description: The header of the section.
        type: string
    type: object
  Oaklands.V1.Region:
    properties:
      bounds:
        description: The bounds that make up the region in the world.
        items:
          $ref: '#/definitions/Oaklands.V1.RegionBound'
        type: array
      description:
        description: The description of the region.
        type: string
      discovery_reward:
        description: The amount of sprouts rewarded for discovering the region.
        type: integer
      display_name:
        description: The display name of the region.
        type: string
      id:
        description: The ID of the region.
        type: string
      island:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.RegionIsland'
        description: The island that the region is on.
      layer:
        description: The layer of the region. 0 is the surface, anything higher is
          a cave layer.
        type: integer
      resources:
        description: The material index entries that can be found in the region.
        items:
          $ref: '#/definitions/Oaklands.V1.RegionResource'
        type: array
      tier:
        description: The tool tier the region is meant for.
        type: integer
    type: object
  Oaklands.V1.RegionBound:
    properties:
      position:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.RegionVector'
        description: The center position of the bound in the world.
      rotation:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.RegionVector'
        description: The orientation of the bound, in degrees.
      size:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.RegionVector'
        description: The size of the bound.
    type: object
  Oaklands.V1.RegionIsland:
    properties:
      display_name:
        description: The display name of the island.
        type: string
      id:
        description: The ID of the island.
        type: string
      tier:
        description: The tool tier the island is meant for.
        type: integer
    type: object
  Oaklands.V1.RegionResource:
    properties:
      category:
        description: The category of the entry (trees, rocks, ores, creatures or forageables).
        type: string
      display_name:
        description: The display name of the resource.
        type: string
      id:
        description: The ID of the entry.
        type: string
      media:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.Media'
        description: The image of the entry.
    type: object
  Oaklands.V1.RegionVector:
    properties:
      x:
        type: number
      "y":
        type: number
      z:
        type: number
    type: object
  Oaklands.V1.StoreItem:
    properties:
      currency:
        description: The currency that is used to purchase the item.
        type: string
      description:
        description: The description of the item.
        type: string
      display_name:
        description: The display name of the item.
        type: string
      id:
        description: The id  of the item.
        type: string
      image:
        description: |-
          The image of the item.

          Deprecated: Use `media` instead.
        type: string
        x-deprecated: "true"
      media:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.Media'
        description: The image of the item.
      price:
        description: How much the item costs.
        type: number
    type: object
  Oaklands.V1.VersionInfo:
    properties:
      last_update:
        description: The last time the experience had an update published.
        type: string
      next_check:
        description: The next time that the experience will be checked for updates.
        type: string
      version:
        description: The current published version of the experience.
        type: string
    type: object
info:
  contact: {}
  description: |-
    This is the official, publicly accessible, API to get data in Typical Developers' experiences.
    # Notes
    - All dates and timestamps are returned in [ISO8601](https://en.wikipedia.org/wiki/ISO_8601) format and are set as a UTC timezone.<br>
    ---
    # Caching
    All responses will return an `ETag` header, which is an MD5 hash of the response. You are able to use this hash to verify
    if there's updated content by supplying a `If-None-Match` in the requests header for the next request you make.<br>
    - Status `200 - OK` will be returned if the resource has been updated.
    - Status `304 - Not Modified` will be returned if the resource has not been updated.
    ---
    # Ratelimits
    At the moment, the API does not have any rate limits. Please use the API responsibly by following good practices.
    Abuse detection will result in a indefinite ban from accessing the API. Please reach out in our [Discord Server](https://discord.gg/typical)
    if you have ran into this issue.
  title: Typical Developers - Public Experience API
paths:
  /oaklands/v1/changelogs:
    get:
      description: Fetch a list of changelog versions with their information.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - default: desc
        description: The direction to order by. This will use the changelog's date
          to order.
        enum:
        - desc
        - asc
        in: query
        name: order_by
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/Oaklands.V1.ChangelogVersion'
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/changelogs/{version}:
    get:
      description: Fetch a changelog version.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - default: latest
        description: The version of changelog. For quick access to the latest changelog,
          use 'latest' as the value.
        in: path
        name: version
        required: true
        type: string
      - description: Use the changelog's id instead. You do not have to provide a
          value to this, you can just add it as `?useId`.
        in: query
        name: useId
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/Oaklands.V1.Changelog'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/economy/daily-material-buffs:
    get:
      description: Get all of the daily material buff values (tree, rocks, ores).
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                additionalProperties:
                  items:
                    $ref: '#/definitions/Oaklands.V1.MaterialBuff'
                  type: array
                type: object
              refresh_at:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/index:
    get:
      description: List the material index categories.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  type: string
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/index/{category}:
    get:
      description: List the material index entries in a category, without the entry
        details.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - description: The category of the entries (trees, rocks, ores, creatures or
          forageables).
        in: path
        name: category
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/Oaklands.V1.IndexEntryInfo'
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/index/{category}/{id}:
    get:
      description: Get a material index entry.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - description: The category of the entry (trees, rocks, ores, creatures or forageables).
        in: path
        name: category
        required: true
        type: string
      - description: The ID of the entry (e.g. `BirchTree` or `Rose Gold`).
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/Oaklands.V1.IndexEntry'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/items:
    get:
      description: Get a list of available items.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  type: string
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/items/{id}:
    get:
      description: Get information for an item.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - description: The id of the newsletter. For quick access to the latest newsletter,
          use 'latest' as the value.
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/Oaklands.V1.Item'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/newsletters:
    get:
      description: Fetch a list of newsletters.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - default: desc
        description: The direction to order by. This will use the changelog's date
          to order.
        enum:
        - desc
        - asc
        in: query
        name: order_by
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/Oaklands.V1.NewsletterEntry'
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/newsletters/{id}:
    get:
      description: Fetch a list of newsletters.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - default: latest
        description: The id of the newsletter. For quick access to the latest newsletter,
          use 'latest' as the value.
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/Oaklands.V1.Newsletter'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/stores:
    get:
      description: List the available stores.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  type: string
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/stores/{store_name}:
    get:
      description: Fetch the items inside of a specific store.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - description: The name of the store that you want to fetch.<br>You can fetch
          a list of stores by requesting [`/oaklands/v1/stores`](/#tag/oaklands/GET/oaklands/v1/stores).
        in: path
        name: store_name
        required: true
        type: string
      - default: price
