definitions:
  API.ErrorResponse:
    properties:
      message:
        description: The message for the returned error.
        type: string
      type:
        description: The type of error that was returned.
        type: string
    type: object
  Oaklands.V1.Changelog:
    properties:
      added:
        items:
          type: string
        type: array
      changed:
        items:
          type: string
        type: array
      date:
        type: string
      fixed:
        items:
          type: string
        type: array
      id:
        type: integer
      version:
        type: string
    type: object
  Oaklands.V1.ChangelogVersion:
    properties:
      date:
        type: string
      id:
        type: integer
      version:
        type: string
    type: object
  Oaklands.V1.MaterialValues:
    properties:
      base_value:
        description: The base value for the material.
        type: number
      current_value:
        description: The current value of the material.
        type: number
      type:
        description: The type of material.
        type: string
    type: object
  Oaklands.V1.Newsletter:
    properties:
      banner_image_id:
        description: The Roblox ID for the banner of the newsletter.
        type: string
      date:
        description: The date that the newsletter was released.
        type: string
      header:
        description: The primary header of the newsletter.
        type: string
      sections:
        description: Sections of the newsletter.
        items:
          $ref: '#/definitions/Oaklands.V1.NewsletterSection'
        type: array
      subheader:
        description: The secondary header of the newsletter.
        type: string
    type: object
  Oaklands.V1.NewsletterEntry:
    properties:
      banner_image_id:
        description: The Roblox ID for the banner of the newsletter.
        type: string
      date:
        description: The date that the newsletter was released.
        type: string
      header:
        description: The primary header of the newsletter.
        type: string
      id:
        description: The ID for the newsletter.
        type: string
    type: object
  Oaklands.V1.NewsletterSection:
    properties:
      content:
        description: The type of content in the section.
        items: {}
        type: array
      header:
        description: The header of the section.
        type: string
    type: object
  Oaklands.V1.StockMarket:
    properties:
      currency_type:
        description: The currency of the material.
        type: string
      current_multiplier:
        description: The current multiplier.
        type: number
      display_name:
        description: The display name of the material.
        type: string
      last_multiplier:
        description: The multipler from the last time the stock refreshed.
        type: number
      name:
        description: The identifier for the material.
        type: string
      values:
        description: The values of the different types for the materials
        items:
          $ref: '#/definitions/Oaklands.V1.MaterialValues'
        type: array
    type: object
  Oaklands.V1.StoreItem:
    properties:
      currency:
        description: The currency that is used to purchase the item.
        type: string
      description:
        description: The description of the item.
        type: string
      display_name:
        description: The display name of the item.
        type: string
      image:
        description: The image of the item.
        type: string
      name:
        description: The name (identifier) of the item.
        type: string
      price:
        description: How much the item costs.
        type: number
    type: object
  Oaklands.V1.Sync:
    properties:
      classic_store:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.SyncdInfoWithReset'
        description: Sync information for the classic store.
      meta:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.SyncMeta'
        description: Information from the experience that is used for sync checks.
      stock_market:
        allOf:
        - $ref: '#/definitions/Oaklands.V1.SyncdInfoWithReset'
        description: Sync information for the stock market.
    type: object
  Oaklands.V1.SyncMeta:
    properties:
      last_update:
        description: The last time that data from Oaklands that can be updated from
          experience changes was synced and updated.
        type: string
      next_check:
        description: The next time Oaklands will be checked for an update.
        type: string
    type: object
  Oaklands.V1.SyncdInfoWithReset:
    properties:
      last_sync:
        description: The last time that the resource was updated.
        type: string
      next_sync:
        description: The next time that the resource will be updated
        type: string
    type: object
  oaklands_v1.VersionInfo:
    properties:
      last_update:
        description: The last time the experience had an update published.
        type: string
      next_check:
        description: The next time that the experience will be checked for updates.
        type: string
      version:
        description: The current published version of the experience.
        type: string
    type: object
info:
  contact: {}
  description: |-
    This is the official, publicly accessible, API to get data in Typical Developers' experiences.
    # Notes
    - All dates and timestamps are returned in [ISO8601](https://en.wikipedia.org/wiki/ISO_8601) format and are set as a UTC timezone.<br>
    ---
    # Caching
    All responses will return an `ETag` header, which is an MD5 hash of the response. You are able to use this hash to verify
    if there's updated content by supplying a `If-None-Match` in the requests header for the next request you make.<br>
    - Status `200 - OK` will be returned if the resource has been updated.
    - Status `304 - Not Modified` will be returned if the resource has not been updated.
    ---
    # Ratelimits
    At the moment, the API does not have any rate limits. Please use the API responsibly by following good practices.
    Abuse detection will result in a indefinite ban from accessing the API. Please reach out in our [Discord Server](https://discord.gg/typical)
    if you have ran into this issue.
  title: Typical Developers - Public Experience API
paths:
  /oaklands/v1/changelogs:
    get:
      description: Fetch a list of changelog versions with their information.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - default: desc
        description: The direction to order by. This will use the changelog's date
          to order.
        enum:
        - desc
        - asc
        in: query
        name: order_by
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/Oaklands.V1.ChangelogVersion'
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/changelogs/{version}:
    get:
      description: Fetch a changelog version.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - default: latest
        description: The version of changelog. For quick access to the latest changelog,
          use 'latest' as the value.
        in: path
        name: version
        required: true
        type: string
      - description: Use the changelog's id instead. You do not have to provide a
          value to this, you can just add it as `?useId`.
        in: query
        name: useId
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/Oaklands.V1.Changelog'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/economy/stock-market/ores:
    get:
      deprecated: true
      description: Fetch the current ore stock market.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - default: current_multiplier
        description: The field to sort by.
        enum:
        - name
        - current_multiplier
        - last_multiplier
        - values.current_value
        - values.base_value
        in: query
        name: sort_by
        type: string
      - default: desc
        description: The direction to order by.
        enum:
        - desc
        - asc
        in: query
        name: order_by
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/Oaklands.V1.StockMarket'
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
