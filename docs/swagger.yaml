      description: Fetch the current rock stock market.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - default: current_multiplier
        description: The field to sort by.
        enum:
        - name
        - current_multiplier
        - last_multiplier
        - values.current_value
