                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/economy/stock-market/trees:
    get:
      deprecated: true
      description: Fetch the current tree stock market.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - default: current_multiplier
        description: The field to sort by.
        enum:
        - name
        - current_multiplier
        - last_multiplier
        - values.current_value
        - values.base_value
        in: query
        name: sort_by
