          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/stores:
    get:
      description: List the available stores.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  type: string
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/stores/{store_name}:
    get:
      description: Fetch the items inside of a specific store.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - description: The name of the store that you want to fetch.<br>You can fetch
          a list of stores by requesting [`/oaklands/v1/stores`](/#tag/oaklands/GET/oaklands/v1/stores).
        in: path
        name: store_name
        required: true
        type: string
      - default: price
        description: The value to sort by.
        enum:
        - price
        - name
        in: query
        name: sort_by
        type: string
      - default: desc
        description: The direction to order by.
        enum:
        - desc
        - asc
        in: query
        name: order_by
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/Oaklands.V1.StoreItem'
                type: array
              restock_at:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/sync:
    get:
      deprecated: true
      description: |-
        Fetch information on when data was last synced from the game.
        It should be noted that a majority of data is fetched when checking if the experience was updated,
        such as newsletters and changelogs. Some content with resync at certain intervals by itself
        alongside update sync checks.<br><br>
        Internally, updates are checked for every **5 minutes**.
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/Oaklands.V1.Sync'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/translations:
    get:
      description: List the available translations.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - description: Return a subset of keys that have a prefix (i.e. using `ItemName`
          would return values for the keys `ItemName` and `ItemName_description`).<br>It
          is suggested to only return the keys you are needing.
        in: query
        name: prefix
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                additionalProperties:
                  type: string
                type: object
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/version-info:
    get:
      description: |-
        Fetch version information for the game.
        It should be noted that data is fetched whenever the published version changes.
        Internally, updates are checked for every **1 minute**.
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/oaklands_v1.VersionInfo'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
