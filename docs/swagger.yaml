      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/Oaklands.V1.StockMarket'
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/newsletters:
    get:
      description: Fetch a list of newsletters.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - default: desc
        description: The direction to order by. This will use the changelog's date
          to order.
        enum:
        - desc
        - asc
        in: query
        name: order_by
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/Oaklands.V1.NewsletterEntry'
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/API.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/API.ErrorResponse'
      tags:
      - Oaklands
  /oaklands/v1/newsletters/{id}:
    get:
      description: Fetch a list of newsletters.
      parameters:
      - description: ETag to validate cached response.
        in: header
        name: If-None-Match
        type: string
      - default: latest
        description: The id of the newsletter. For quick access to the latest newsletter,
          use 'latest' as the value.
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/Oaklands.V1.Newsletter'
            type: object
        "500":
          description: Internal Server Error
