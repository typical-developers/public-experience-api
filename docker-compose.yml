name: public-experience-api

networks:
  default:
    name: services
volumes:
  redis_data:

services:
  redis:
    image: redis/redis-stack:latest
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./deployments/docker/redis/redis.conf:/opt/redis-stack/etc/redis.conf
      - redis_data:/data

  workers:
    build:
      context: .
      dockerfile: deployments/docker/workers/Dockerfile
    networks:
      - default
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  public:
    build:
      context: .
      dockerfile: deployments/docker/public/Dockerfile
    networks:
      - default
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      workers:
        condition: service_started
    expose:
      - "8080"

  docs:
    build:
      context: .
      dockerfile: deployments/docker/docs/Dockerfile
    expose:
      - "8080"
    environment:
      API_REFERENCE_CONFIG: |
        {
          "hideClientButton": true,
          "servers": [
            {
              "url": "${REFERENCE_CONFIG_API_BASE_URL:-http://localhost:8080}"
            }
          ],
          "metaData": {
            "title": "Public Experience API Reference",
            "description": "Documentation for the official Typical Developers public experience api."
          }
        }
    depends_on:
      public:
        condition: service_started
